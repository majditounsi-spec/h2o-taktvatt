<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="apple-touch-icon" href="/logo-icon.svg" />
    <title>H2O Taktvätt & Takmålning – Kalmar län, Öland, Blekinge, Skåne & Halland</title>
    <meta name="description" content="Professionell taktvätt, takmålning, fasadtvätt och anti-alg behandling i Kalmar län, Öland, Blekinge, Skåne och Halland. 10 års garanti och kostnadsfri offert." />
    <meta name="keywords" content="taktvätt, takmålning, fasadtvätt, anti-alg behandling, impregnering, Kalmar, Öland, Blekinge, Skåne, Halland, tak, takvård" />
    <meta name="author" content="H2O Taktvätt" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Swedish" />
    <meta name="geo.region" content="SE" />
    <meta name="geo.placename" content="Kalmar län, Skåne" />

    <!-- Open Graph -->
    <meta property="og:title" content="H2O Taktvätt & Takmålning – Professionell takvård" />
    <meta property="og:description" content="Professionell taktvätt och takmålning med 10 års garanti. Verksamma i Kalmar län, Öland, Blekinge, Skåne och Halland." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:site_name" content="H2O Taktvätt" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="H2O Taktvätt & Takmålning" />
    <meta name="twitter:description" content="Professionell takvård med 10 års garanti – i södra Sverige." />

    <meta name="theme-color" content="#0c1a2e" />

    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "H2O Taktvätt",
        "image": "/images/h2o-logo.png",
        "description": "Professionell taktvätt, takmålning, fasadtvätt och anti-alg behandling med 10 års garanti.",
        "telephone": "+46701234567",
        "email": "info@h2otaktvatt.se",
        "priceRange": "$$",
        "areaServed": ["Kalmar län", "Öland", "Blekinge", "Skåne", "Halland"],
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Kalmar län",
          "addressCountry": "SE"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
            "opens": "07:00",
            "closes": "17:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "08:00",
            "closes": "14:00"
          }
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.7",
          "reviewCount": "50"
        }
      }
    </script>

    <!-- Preconnect to image CDN -->
    <link rel="preconnect" href="https://images.pexels.com" />

    <!-- Preload hero image (LCP element) -->
    <link rel="preload" as="image" href="https://images.pexels.com/photos/8961251/pexels-photo-8961251.jpeg?auto=compress&cs=tinysrgb&w=1280" fetchpriority="high" />

    <!-- Google Fonts: load async to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms: hidden form for build-time detection -->
    <form name="offertforfragan" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="address" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
